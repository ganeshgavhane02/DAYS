<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css project</title>
    <link rel="stylesheet" href="css.css">
    <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

</head>



<body>
    <div class="main_box">
        <input type="checkbox" id="check" />
        <div class="btn_one">
            <label for="check" style="color: black;">
                <i class="fa-solid fa-bars"></i>
            </label>
        </div>

        <div class="sidebar">
            <div class="logo">
                <a href="#">Apna College</a>
            </div>

            <div class="btn_two">
                <label for="check" style="color: black;">
                    <i class="fa-solid fa-xmark"></i>
                </label>
            </div>

            <div class="menu">
                <ul>
                    <li>
                        <span class="fa-solid fa-image" aria-hidden="true"></span>
                        <a href="#">Gallery</a>
                    </li>
                    <li>
                        <span class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></span>
                        <a href="#">Shortcuts</a>
                    </li>
                    <li>
                        <span class="fa-solid fa-photo-film" aria-hidden="true"></span>
                        <a href="#">Exhibits</a>
                    </li>
                    <li>
                        <span class="fa-solid fa-calendar-days" aria-hidden="true"></span>
                        <a href="#">Events</a>
                    </li>
                    <li>
                        <span class="fa-solid fa-store" aria-hidden="true"></span>
                        <a href="#">Store</a>
                    </li>
                    <li>
                        <span class="fa-solid fa-phone" aria-hidden="true"></span>
                        <a href="#">Contact</a>
                    </li>
                    <li>
                        <span class="fa-regular fa-comments" aria-hidden="true"></span>
                        <a href="#">Feedback</a>
                    </li>
                </ul>
            </div>

            <div class="social_media">
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </div>

</body>

</html>
